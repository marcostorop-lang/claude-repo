# /etc/logrotate.d/polymarket-bot
# Keep bot.log and trades.jsonl bounded on long runs.

/opt/polymarket-bot/bot/logs/bot.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/opt/polymarket-bot/bot/logs/trades.jsonl {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/opt/polymarket-bot/bot/logs/rejections.jsonl {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
