# Polymarket bot — local orchestration.
#
# Single-service compose: runs the paper-trading bot with a named
# volume for state (DB, logs, alerts, metrics, backups).  Start with:
#
#     docker compose up -d bot
#     docker compose logs -f bot
#     docker compose exec bot python -m src.main summary
#
# Live trading stays disabled unless *both* env vars are set in an
# external ``.env`` file that you explicitly commit out of version
# control.  See docs/runbook.md for the live-mode checklist.

services:
  bot:
    build: .
    image: polybot:latest
    container_name: polybot
    restart: unless-stopped
    env_file:
      # Optional — create on your host to override defaults.  The
      # container still runs if the file is absent (compose tolerates
      # missing env_file when no keys are required).
      - path: ./.env
        required: false
    environment:
      TRADING_MODE: paper
      LOG_LEVEL: INFO
      POLL_INTERVAL_SECONDS: "60"
      # Observability — all default to on inside the container so a
      # fresh install produces alert + metrics files out of the box.
      # Flip to empty strings to disable.
      ALERT_LOG_FILE: /data/alerts.jsonl
      METRICS_FILE: /data/metrics.jsonl
      DB_BACKUP_DIR: /data/backups
      DB_BACKUP_INTERVAL_HOURS: "24"
      DB_BACKUP_KEEP: "7"
      # Rotated file log (10 MB x 5 backups ≈ 60 MB ceiling).
      LOG_MAX_BYTES: "10485760"
      LOG_BACKUP_COUNT: "5"
    volumes:
      - polybot-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import os,sys,time;
          p=os.environ.get('SQLITE_DB_PATH','/data/polymarket_bot.db');
          sys.exit(0 if os.path.exists(p) and (time.time()-os.path.getmtime(p))<300 else 1)
      interval: 2m
      timeout: 10s
      start_period: 1m
      retries: 3
    # Read-only root FS — the bot only needs to write to /data.
    # /tmp is a separate tmpfs so transient files never persist.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  polybot-data:
    # Using a named volume (not a bind mount) keeps SQLite free of
    # host-filesystem quirks (case-sensitivity, fsync semantics).
    # Operators who want host access can switch to a bind mount via
    # a compose override file.
